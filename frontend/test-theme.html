<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Theme Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="min-h-screen bg-white dark:bg-slate-900 text-gray-900 dark:text-white transition-colors">
    <div class="p-8">
        <h1 class="text-4xl font-bold mb-4">Dark Mode Test</h1>
        <p class="mb-4">This text should be white on dark background</p>
        <button onclick="document.documentElement.classList.toggle('dark')" 
                class="px-4 py-2 bg-blue-500 text-white rounded">
            Toggle Theme
        </button>
    </div>
</body>
</html>
